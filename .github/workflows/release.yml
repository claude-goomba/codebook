name: Release Update Package

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify version
        run: node --input-type=module -e "import pkg from './package.json' with { type:'json' }; if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) process.exit(1);"
      - run: npm test
      - run: npm run build
      - name: Package static site
        working-directory: dist
        env:
          VERSION: ${{ github.ref_name }}
        run: zip -r "../codebook-${VERSION}-web.zip" .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" "codebook-${VERSION}-web.zip" --verify-tag --title "Codebook ${VERSION}" --generate-notes
